docs_dir: docs

site_name: Goga tool viewer
site_description: Goga tool. Viewer for goga project visualization.
site_url: https://qarium.github.io/goga-tool-viewer/
repo_url: https://github.com/qarium/goga-tool-viewer
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  logo: https://avatars.githubusercontent.com/u/262344922?s=200&v=4
  palette:
    - scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
        media: "(prefers-color-scheme: light)"
    - scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
        media: "(prefers-color-scheme: dark)"
  features:
    - navigation.tabs
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Cells:
    - cells/index.md
    - Models: cells/models.md
    - Parser: cells/parser.md
    - Frontend: cells/frontend.md
    - Server: cells/server.md
    - Port Finder: cells/port-finder.md

plugins:
  - search
